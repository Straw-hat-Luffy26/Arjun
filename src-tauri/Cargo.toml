[package]
name = "sarathi"
version = "0.2.0"
description = "Arjun: a sovereign local agentic workbench for SIH 2026 PS 26117"
authors = ["Arjun Team"]
edition = "2021"

[lib]
name = "sarathi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Default is CPU-only so the project builds without a CUDA/Vulkan SDK present.
#
# GPU acceleration is OPT-IN. `llama-cpp-sys-2` compiles llama.cpp with
# `GGML_CUDA=OFF` unless the `cuda` feature is set (build.rs:910) — there is no
# autodetection. Without one of these features every `--n-gpu-layers` value is
# silently ignored and inference runs entirely on CPU.
#
#   cargo build --features cuda     # requires the full CUDA Toolkit (nvcc)
#   cargo build --features vulkan   # requires the Vulkan SDK
# GPU acceleration is OPT-IN. Without it llama.cpp silently ignores every
# `n_gpu_layers` request and runs entirely on CPU — the runtime logs a warning
# saying so rather than pretending otherwise.
#
#   cargo build --features cuda     # needs the CUDA Toolkit (nvcc)
#   cargo build --features vulkan   # needs the Vulkan SDK
#
# CUDA has a host-compiler constraint that is easy to trip over: nvcc rejects
# MSVC newer than Visual Studio 2022. On a machine with VS 18 (MSVC 19.51) and
# CUDA 12.6 the build fails with:
#
#   nvcc fatal: unsupported Microsoft Visual Studio version! Only the versions
#   between 2017 and 2022 (inclusive) are supported!
#
# Fixes, in order of preference:
#   1. Install VS 2022 Build Tools alongside, and point CMake at that host
#      compiler via CMAKE_CUDA_HOST_COMPILER.
#   2. Use `--features vulkan` instead — no host-compiler version constraint.
#
# `-allow-unsupported-compiler` also silences the check, but nvcc warns it may
# cause "incorrect run time execution". Wrong GPU kernels mean silently wrong
# model output, so it is not used here.
default = []
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "fs", "io-util", "macros", "net", "process", "time"] }
tokio-stream = "0.1"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
base64 = "0.22"
futures-util = "0.3"
llama-cpp-2 = { version = "0.1" }
rusqlite = { version = "0.31", features = ["bundled"] }
async-trait = "0.1"
sha2 = "0.10"
# HMAC for provenance signing. See `audit::provenance_hmac`.
hmac = "0.12"
# Constant-time byte comparison so the verifier doesn't leak the matching
# prefix length of a guess at the HMAC.
subtle = "2"
# Cryptographically secure random number generator, used to mint the
# provenance signing key. `rand_core` is the trait-only crate that other
# `rand` features depend on; pulling in the full `rand` here is what
# gives us `thread_rng` and `fill_bytes`.
rand = "0.8"
# Hex encoding for the printed HMAC tag and the message digest.
hex = "0.4"
# A .docx / .xlsx is a ZIP of XML parts. Writing the parts directly rather than
# through a document library keeps the template engine — and therefore the
# document's structure — something a reviewer can read in this repository.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Password hashing. Argon2id is the current recommendation for storing
# passwords: memory-hard, so a stolen database cannot be attacked with the
# GPU throughput that makes fast hashes useless here.
argon2 = "0.5"
# CSPRNG for per-password salts.
rand_core = { version = "0.6", features = ["std"] }
# Used by `documents::sandbox` to call `prctl(PR_SET_NO_NEW_PRIVS)` in the
# document sidecar child process, removing the setuid/setgid escalation
# path for the untrusted-input parser stack.
libc = "0.2"
# Renders the Jinja chat template embedded in a GGUF. llama.cpp's built-in
# `llama_chat_apply_template` only recognises a fixed set of well-known formats
# and returns -1 for anything else, which leaves newer or custom-format models
# with no correct prompt framing at all.
minijinja = { version = "2", features = ["macros", "loop_controls", "adjacent_loop_items"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52.0", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_JobObjects"] }

# libc exposes prlimit64 (Linux) and setrlimit (macOS), used by the
# enclave module to install the per-process memory ceiling on
# non-Windows platforms. Not a Windows dep.
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
# Temporary directories for tests that touch the filesystem, cleaned up on drop
# so a failed run cannot leave state that makes the next one pass.
tempfile = "3"
